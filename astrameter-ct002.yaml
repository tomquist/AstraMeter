# AstraMeter for one Marstek Venus E 2.0 and one Venus E 3.0.
# Grid source: Shelly Pro 3EM at 10.0.40.72.
# Marstek Venus E 2.0 (MST_ACCP_V2) is reachable at 10.0.40.85.
# Marstek Venus E 3.0 is reachable at 10.0.40.77.
# FoxESS H3-6.0-E is connected over Modbus RTU.
# Its cloud connector at 10.0.40.69 is not used for local Modbus.

esphome:
  name: astrameter-ct002
  friendly_name: AstraMeter CT002
  includes:
    - foxess_priority.h

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

uart:
  id: foxess_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

modbus:
  id: foxess_modbus
  uart_id: foxess_uart
  flow_control_pin: GPIO5
  send_wait_time: 250ms

modbus_controller:
  - id: foxess_h3
    address: 247
    modbus_id: foxess_modbus
    update_interval: 10s

output:
  - platform: modbus_controller
    id: foxess_work_mode_writer
    modbus_controller_id: foxess_h3
    address: 41000
    register_type: holding
    value_type: U_WORD
    write_lambda: |-
      return x >= 0.5f ? 2.0f : 0.0f;

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:
  port: 80
  version: 3

external_components:
  - source: github://tomquist/astrameter@2.3.1
    components: [ct002]

http_request:
  useragent: esphome/astrameter
  timeout: 5s
  buffer_size_rx: 4096

globals:
  - id: shelly_raw_grid_total
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: shelly_raw_updated_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: foxess_soc_updated_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: foxess_power_updated_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: foxess_mode_updated_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

interval:
  - interval: 1s
    then:
      - http_request.get:
          url: http://10.0.40.72/rpc/EM.GetStatus?id=0
          capture_response: true
          max_response_buffer_size: 4096
          on_response:
            then:
              - lambda: |-
                  json::parse_json(body, [](JsonObject root) -> bool {
                    const float l1 = root["a_act_power"];
                    const float l2 = root["b_act_power"];
                    const float l3 = root["c_act_power"];
                    const float total = l1 + l2 + l3;
                    id(shelly_raw_grid_total) = total;
                    id(shelly_raw_updated_ms) = millis();
                    if (astra_foxess_priority.suppress_marstek_charge() && total < -20.0f) {
                      id(grid_l1).publish_state(0.0f);
                      id(grid_l2).publish_state(0.0f);
                      id(grid_l3).publish_state(0.0f);
                    } else {
                      id(grid_l1).publish_state(l1);
                      id(grid_l2).publish_state(l2);
                      id(grid_l3).publish_state(l3);
                    }
                    return true;
                  });
  - interval: 10s
    startup_delay: 20s
    then:
      - lambda: |-
          const uint32_t now = millis();
          const bool stale = now - id(shelly_raw_updated_ms) > 30000 ||
                             now - id(foxess_soc_updated_ms) > 60000 ||
                             now - id(foxess_power_updated_ms) > 60000 ||
                             now - id(foxess_mode_updated_ms) > 60000;
          const int command = stale
              ? astra_foxess_priority.tick(NAN, NAN, NAN, -1)
              : astra_foxess_priority.tick(
                    id(shelly_raw_grid_total), id(foxess_battery_soc).state,
                    id(foxess_battery_power).state,
                    static_cast<int>(lroundf(id(foxess_work_mode).state)));
          if (command >= 0) {
            ESP_LOGI("foxess_priority", "State: %s; setting FoxESS mode to %d",
                     astra_foxess_priority.state_name(), command);
            id(foxess_work_mode_writer).set_level(command == 2 ? 1.0f : 0.0f);
          }

sensor:
  - platform: modbus_controller
    modbus_controller_id: foxess_h3
    name: FoxESS PV1 Voltage
    register_type: holding
    address: 31000
    value_type: U_WORD
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    modbus_controller_id: foxess_h3
    name: FoxESS Battery State of Charge
    id: foxess_battery_soc
    register_type: holding
    address: 31038
    value_type: U_WORD
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    on_value:
      then:
        - lambda: id(foxess_soc_updated_ms) = millis();

  - platform: modbus_controller
    modbus_controller_id: foxess_h3
    name: FoxESS Battery Power
    id: foxess_battery_power
    register_type: holding
    address: 31036
    value_type: S_WORD
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    on_value:
      then:
        - lambda: id(foxess_power_updated_ms) = millis();

  - platform: modbus_controller
    modbus_controller_id: foxess_h3
    name: FoxESS Work Mode
    id: foxess_work_mode
    register_type: holding
    address: 41000
    value_type: U_WORD
    reuse_previous_range: false
    on_value:
      then:
        - lambda: id(foxess_mode_updated_ms) = millis();

  - platform: modbus_controller
    modbus_controller_id: foxess_h3
    name: FoxESS Minimum State of Charge on Grid
    id: foxess_min_soc_on_grid
    register_type: holding
    address: 41011
    value_type: U_WORD
    reuse_previous_range: false
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement

  - platform: template
    id: grid_l1
    name: Grid L1 Power
    unit_of_measurement: W
    device_class: power
  - platform: template
    id: grid_l2
    name: Grid L2 Power
    unit_of_measurement: W
    device_class: power
  - platform: template
    id: grid_l3
    name: Grid L3 Power
    unit_of_measurement: W
    device_class: power

text_sensor:
  - platform: template
    name: ASTRA Storage Priority
    update_interval: 10s
    lambda: |-
      return {astra_foxess_priority.state_name()};

ct002:
  id: ct002_main
  ct_mac: "02b25069325f"
  power_sensor_l1: grid_l1
  power_sensor_l2: grid_l2
  power_sensor_l3: grid_l3
  ct_type: HME-4
  active_control: true
  filters:
    deadband:
      deadband: 20
  balancer:
    fair_distribution: true
    balance_gain: 0.2
    balance_deadband: 25
    max_correction_per_step: 80
    pace_base_step: 30
    pace_max_step: 100
    min_dc_output: 0
    min_efficient_power: 150
    efficiency_rotation_interval: 15min
    probe_min_power: 80
  saturation:
    enabled: true
  dashboard:
    controls: false
