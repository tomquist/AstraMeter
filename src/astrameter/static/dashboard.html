<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>AstraMeter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2303a9f4'/%3E%3Cpath d='M18 4 10 18h5l-1 10 8-14h-5z' fill='%23fff'/%3E%3C/svg%3E">
<style>/* AstraMeter dashboard — styled to sit inside Home Assistant without
 * looking like a guest.
 *
 * Home Assistant serves add-on panels in an iframe, and an iframe inherits
 * none of HA's CSS custom properties. So every HA token is mirrored here
 * with HA's own default value as the fallback: `var(--primary-color, #03a9f4)`
 * resolves to the fallback today, and starts tracking the user's theme for
 * free if HA ever pipes its variables through ingress.
 *
 * Colour never carries meaning alone — every status also has a glyph, so the
 * page reads in greyscale and to a deuteranope.
 */

:root {
  color-scheme: light;

  --ha-primary: var(--primary-color, #03a9f4);
  --ha-accent: var(--accent-color, #ff9800);
  --text: var(--primary-text-color, #212121);
  --text-dim: var(--secondary-text-color, #727272);
  --text-faint: var(--disabled-text-color, #bdbdbd);
  --divider: var(--divider-color, rgba(0, 0, 0, 0.12));
  --card: var(--card-background-color, #fff);
  --bg: var(--primary-background-color, #fafafa);
  --bg-sunken: var(--secondary-background-color, #e5e5e5);
  --radius: var(--ha-card-border-radius, 12px);

  /* Status fills. Text never sits directly on these — see --*-fg. */
  --ok: var(--state-icon-active-color, #43a047);
  --warn: #ffa600;
  --err: #db4437;
  --idle: #8e8e8e;
  /* Foregrounds derived to clear 4.5:1 on the card background: #ffa600 is
   * ~2.0:1 and #43a047 ~3.4:1, so neither may be used as text. */
  --ok-fg: #2b7430;
  --warn-fg: #8a5a00;
  --err-fg: #b3261e;

  /* Energy semantics: import is what costs money, export is what earns. */
  --import: #e2703a;
  --export: #3d9970;
  --charge: #4a7fd4;
  --discharge: #b06fc4;

  --shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --text: var(--primary-text-color, #e1e1e1);
    --text-dim: var(--secondary-text-color, #9b9b9b);
    --text-faint: var(--disabled-text-color, #6f6f6f);
    --divider: var(--divider-color, rgba(225, 225, 225, 0.12));
    --card: var(--card-background-color, #1c1c1c);
    --bg: var(--primary-background-color, #111);
    --bg-sunken: var(--secondary-background-color, #202020);
    --ok-fg: #7ac67f;
    --warn-fg: #ffc451;
    --err-fg: #ff8a80;
    --shadow: none;
  }
}

/* The explicit toggle must beat the media query in both directions, so each
 * theme is stated as its own rule rather than relying on cascade order. */
:root[data-theme="light"] {
  color-scheme: light;
  --text: #212121;
  --text-dim: #727272;
  --text-faint: #bdbdbd;
  --divider: rgba(0, 0, 0, 0.12);
  --card: #fff;
  --bg: #fafafa;
  --bg-sunken: #e5e5e5;
  --ok-fg: #2b7430;
  --warn-fg: #8a5a00;
  --err-fg: #b3261e;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --text: #e1e1e1;
  --text-dim: #9b9b9b;
  --text-faint: #6f6f6f;
  --divider: rgba(225, 225, 225, 0.12);
  --card: #1c1c1c;
  --bg: #111;
  --bg-sunken: #202020;
  --ok-fg: #7ac67f;
  --warn-fg: #ffc451;
  --err-fg: #ff8a80;
  --shadow: none;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
  /* HA's own density: 14px base rather than 16px. */
  font-size: 87.5%;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

#app {
  container-type: inline-size;
  min-height: 100vh;
}

/* ── app bar ─────────────────────────────────────────────────────── */

.bar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  background: var(--card);
  border-bottom: 1px solid var(--divider);
}

.bar h1 {
  margin: 0;
  font-size: 1.05rem;
  font-weight: 500;
  letter-spacing: 0.1px;
}

.bar .spacer {
  flex: 1;
}

.bar .ver {
  font-size: 0.75rem;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}

/* A 2px gradient hairline is the only place the AstraMeter brand appears in
 * the chrome; everything else uses HA neutrals so the panel reads as native. */
.bar::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 2px;
  background: linear-gradient(90deg, var(--export), var(--ha-primary), var(--import));
  opacity: 0.75;
}

.tabs {
  display: flex;
  gap: 2px;
  padding: 0 10px;
  background: var(--card);
  border-bottom: 1px solid var(--divider);
  overflow-x: auto;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar {
  display: none;
}

.tab {
  appearance: none;
  border: 0;
  background: none;
  color: var(--text-dim);
  font: inherit;
  font-weight: 500;
  padding: 11px 14px;
  cursor: pointer;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
}

.tab:hover {
  color: var(--text);
}

.tab[aria-current="page"] {
  color: var(--ha-primary);
  border-bottom-color: var(--ha-primary);
}

main {
  padding: 16px;
  max-width: 1100px;
  margin: 0 auto;
  display: grid;
  gap: 14px;
}

/* ── cards ───────────────────────────────────────────────────────── */

.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--divider);
  padding: 14px 16px;
}

.card > h2 {
  margin: 0 0 10px;
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 8px;
}

.card > h2 .spacer {
  flex: 1;
}

.grid {
  display: grid;
  gap: 14px;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
}

/* ── the balance rail ────────────────────────────────────────────── */

.rail {
  display: grid;
  gap: 6px;
}

.rail-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.rail-value {
  font-size: 2rem;
  font-weight: 300;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.5px;
  /* Reserve the widest plausible value so the layout never shifts when the
   * number changes width. */
  min-width: 7ch;
}

.rail-value.import {
  color: var(--import);
}

.rail-value.export {
  color: var(--export);
}

.rail-label {
  color: var(--text-dim);
  font-size: 0.85rem;
}

.rail-track {
  position: relative;
  height: 34px;
  background: var(--bg-sunken);
  border-radius: 6px;
  overflow: hidden;
}

.rail-zero {
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--text-faint);
  opacity: 0.9;
}

.rail-fill {
  position: absolute;
  top: 6px;
  bottom: 6px;
  /* scaleX only: a compositor frame, no layout, and it settles before the
   * next poll lands. */
  transition: transform 180ms ease-out;
  transform-origin: left center;
  border-radius: 3px;
}

.rail-fill.import {
  background: var(--import);
}

.rail-fill.export {
  background: var(--export);
}

.rail-scale {
  display: flex;
  justify-content: space-between;
  font-size: 0.7rem;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}

/* Per-battery contribution bars share the rail's axis, so the picture
 * carries the invariant: the battery bars are what pull the grid to zero. */
.contrib {
  display: grid;
  gap: 5px;
  margin-top: 4px;
}

.contrib-caption {
  font-size: 0.72rem;
  color: var(--text-dim);
  margin-top: 4px;
}

.contrib-row {
  display: grid;
  grid-template-columns: minmax(90px, 130px) 1fr minmax(72px, auto);
  align-items: center;
  gap: 10px;
  font-size: 0.8rem;
}

.contrib-name {
  color: var(--text-dim);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.contrib-track {
  position: relative;
  height: 14px;
  background: var(--bg-sunken);
  border-radius: 3px;
  overflow: hidden;
}

.contrib-fill {
  position: absolute;
  top: 2px;
  bottom: 2px;
  border-radius: 2px;
  transition: transform 180ms ease-out;
  transform-origin: left center;
}

.contrib-fill.charge {
  background: var(--charge);
}

.contrib-fill.discharge {
  background: var(--discharge);
}

.contrib-val {
  text-align: right;
  font-variant-numeric: tabular-nums;
  font-family: var(--mono);
  font-size: 0.75rem;
}

/* ── status chips ────────────────────────────────────────────────── */

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.2px;
  background: var(--bg-sunken);
  color: var(--text-dim);
  white-space: nowrap;
}

.chip .glyph {
  font-size: 0.85em;
  line-height: 1;
}

.chip.ok {
  color: var(--ok-fg);
  background: color-mix(in srgb, var(--ok) 16%, transparent);
}

.chip.warn {
  color: var(--warn-fg);
  background: color-mix(in srgb, var(--warn) 20%, transparent);
}

.chip.err {
  color: var(--err-fg);
  background: color-mix(in srgb, var(--err) 16%, transparent);
}

/* ── key/value rows ──────────────────────────────────────────────── */

.kv {
  display: grid;
  grid-template-columns: minmax(120px, auto) 1fr;
  gap: 4px 14px;
  font-size: 0.82rem;
}

.kv dt {
  color: var(--text-dim);
}

.kv dd {
  margin: 0;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}

.mono {
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--text-dim);
}

/* ── battery cards ───────────────────────────────────────────────── */

.batt-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}

.batt-head h3 {
  margin: 0;
  font-size: 0.95rem;
  font-weight: 500;
}

.batt-figure {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin: 6px 0 10px;
}

.batt-figure .n {
  font-size: 1.5rem;
  font-weight: 300;
  font-variant-numeric: tabular-nums;
  min-width: 6ch;
}

.batt-figure .n.charge {
  color: var(--charge);
}

.batt-figure .n.discharge {
  color: var(--discharge);
}

.meter {
  height: 4px;
  border-radius: 2px;
  background: var(--bg-sunken);
  overflow: hidden;
  margin-top: 3px;
}

.meter > span {
  display: block;
  height: 100%;
  background: var(--ha-primary);
  transition: transform 180ms ease-out;
  transform-origin: left center;
}

/* ── controls ────────────────────────────────────────────────────── */

button.btn {
  appearance: none;
  font: inherit;
  font-weight: 500;
  border-radius: 6px;
  border: 1px solid var(--divider);
  background: var(--card);
  color: var(--text);
  padding: 6px 12px;
  cursor: pointer;
}

button.btn:hover:not(:disabled) {
  background: var(--bg-sunken);
}

button.btn.primary {
  background: var(--ha-primary);
  border-color: var(--ha-primary);
  color: #fff;
}

button.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

button.btn.sm {
  padding: 3px 9px;
  font-size: 0.78rem;
}

input,
select,
textarea {
  font: inherit;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--divider);
  border-radius: 6px;
  padding: 6px 8px;
  width: 100%;
}

textarea {
  font-family: var(--mono);
  font-size: 0.78rem;
  min-height: 55vh;
  resize: vertical;
  line-height: 1.5;
}

:focus-visible {
  outline: 2px solid var(--ha-primary);
  outline-offset: 2px;
}

.field {
  display: grid;
  gap: 3px;
  font-size: 0.8rem;
}

.field > .name {
  color: var(--text-dim);
  font-weight: 500;
}

.field > .help {
  color: var(--text-faint);
  font-size: 0.72rem;
}

/* An entity option holds one sensor per phase, so it is a list of rows rather
 * than a single box: the combobox and its remove button on one line, what the
 * entity currently resolves to underneath. Spans the field grid because entity
 * ids are long and there can be three of them. */
.entity-field {
  grid-column: 1 / -1;
}

.entity-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 3px 8px;
  align-items: center;
}

.entity-row > .help {
  grid-column: 1 / -1;
  color: var(--text-faint);
  font-size: 0.72rem;
}

/* The suggestion list is drawn here rather than left to a native <datalist>,
 * which Safari on iOS does not implement — on a phone the field was a plain
 * text box with no way to discover an entity id. */
.combo {
  position: relative;
}

.combo-list {
  position: absolute;
  z-index: 20;
  top: calc(100% + 2px);
  left: 0;
  right: 0;
  max-height: 15rem;
  overflow-y: auto;
  margin: 0;
  padding: 4px;
  list-style: none;
  background: var(--card);
  border: 1px solid var(--divider);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.combo-opt {
  display: grid;
  gap: 1px;
  padding: 7px 8px;
  border-radius: 4px;
  cursor: pointer;
}

.combo-opt[aria-selected="true"],
.combo-opt:hover {
  background: color-mix(in srgb, var(--ha-primary) 16%, transparent);
}

.combo-name {
  font-size: 0.82rem;
}

.combo-id {
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--text-dim);
  overflow-wrap: anywhere;
}

/* A suggestion AstraMeter cannot actually read. Offered rather than hidden —
 * a mislabelled sensor is the one people go looking for — but never silently. */
.combo-warn {
  margin-left: 6px;
  padding: 0 5px;
  border-radius: 3px;
  font-size: 0.66rem;
  color: var(--warn-fg);
  background: color-mix(in srgb, var(--warn) 18%, transparent);
}

.combo-empty {
  padding: 7px 8px;
  font-size: 0.78rem;
  color: var(--text-faint);
}

label.row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.82rem;
}

label.row input[type="checkbox"] {
  width: auto;
  margin: 0;
}

.fields {
  display: grid;
  gap: 12px;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
}

/* ── guided form: groups ─────────────────────────────────────────── */

/* Two groups are open — the ones a working setup needs — and the rest fold
 * away. Every option is documented, which is only readable if you are not
 * handed all fifty of them at once. */
.opt-group {
  margin-bottom: 18px;
}

.opt-group > h3 {
  margin: 0;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text);
}

.fold-blurb {
  margin: 3px 0 10px;
  font-size: 0.76rem;
  line-height: 1.45;
  color: var(--text-faint);
}

details.opt-fold {
  margin-bottom: 8px;
  border: 1px solid var(--divider);
  border-radius: var(--radius);
}

details.opt-fold > summary {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  cursor: pointer;
  user-select: none;
  font-size: 0.82rem;
  border-radius: var(--radius);
}

details.opt-fold > summary:hover {
  background: var(--bg-sunken);
}

details.opt-fold[open] > summary {
  border-bottom: 1px solid var(--divider);
  border-radius: var(--radius) var(--radius) 0 0;
}

.fold-title {
  font-weight: 600;
  color: var(--text-dim);
}

details.opt-fold[open] .fold-title,
details.opt-fold > summary:hover .fold-title {
  color: var(--text);
}

.fold-count {
  margin-left: auto;
  color: var(--text-faint);
  font-size: 0.75rem;
}

details.opt-fold > .fold-blurb {
  margin: 10px 12px 0;
}

details.opt-fold > .fields {
  padding: 10px 12px 14px;
}

/* A checkbox option carries its help underneath, like every other field. */
.field.toggle > .row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.82rem;
}

.field.toggle input[type="checkbox"] {
  width: auto;
  margin: 0;
}

/* An action asked about before it happens: the question, then the two ways
 * out of it. Marked like a warning banner so it reads as a stop, not a step. */
.confirm {
  display: grid;
  gap: 8px;
  padding: 12px 14px;
  border-radius: var(--radius);
  border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--divider));
  background: color-mix(in srgb, var(--warn) 10%, var(--card));
}

.confirm-what {
  margin: 0;
  font-size: 0.82rem;
  line-height: 1.5;
}

/* A trend line for one card's own figure, drawn from what the page has
 * already polled. Sized by the card, not by the drawing: the viewBox is
 * fixed and preserveAspectRatio is off, so the line stretches to fit. */
.spark-wrap {
  display: grid;
  gap: 2px;
  margin: 6px 0 2px;
}

.spark {
  display: block;
  width: 100%;
  height: 26px;
  overflow: visible;
}

.spark-line {
  fill: none;
  stroke: var(--ha-primary);
  stroke-width: 1.5;
  stroke-linejoin: round;
  stroke-linecap: round;
  /* The viewBox is stretched to the card's width, which would smear the
   * stroke with it. */
  vector-effect: non-scaling-stroke;
}

.spark-zero {
  stroke: var(--divider);
  stroke-width: 1;
  stroke-dasharray: 2 3;
  vector-effect: non-scaling-stroke;
}

.spark-range {
  font-size: 0.68rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

/* ── banners ─────────────────────────────────────────────────────── */

.banner {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: var(--radius);
  font-size: 0.85rem;
  border: 1px solid var(--divider);
}

.banner.warn {
  background: color-mix(in srgb, var(--warn) 14%, var(--card));
  color: var(--warn-fg);
  border-color: color-mix(in srgb, var(--warn) 35%, transparent);
}

.banner.err {
  background: color-mix(in srgb, var(--err) 12%, var(--card));
  color: var(--err-fg);
  border-color: color-mix(in srgb, var(--err) 32%, transparent);
}

.banner.info {
  background: color-mix(in srgb, var(--ha-primary) 10%, var(--card));
}

.empty {
  text-align: center;
  padding: 28px 16px;
  color: var(--text-dim);
  font-size: 0.85rem;
}

.empty strong {
  display: block;
  color: var(--text);
  font-weight: 500;
  margin-bottom: 4px;
}

/* Offline: dim everything and let the absolute clock times in the markup do
 * the talking. A frozen "0.4 s ago" is the worst possible staleness cue. */
#app[data-conn="offline"] main {
  opacity: 0.55;
  transition: opacity 240ms;
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

/* Container queries, not media queries: inside ingress the iframe width is
 * not the viewport width. */
@container (max-width: 560px) {
  main {
    padding: 12px;
  }

  .rail-value {
    font-size: 1.6rem;
  }

  .contrib-row {
    grid-template-columns: 84px 1fr 68px;
    gap: 7px;
  }

  .kv {
    grid-template-columns: 1fr;
    gap: 1px 0;
  }

  .kv dd {
    margin-bottom: 6px;
  }
}

/* ── config.ini editor ───────────────────────────────────────────── */

details.section {
  padding: 0;
}

details.section > summary {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 16px;
  cursor: pointer;
  user-select: none;
  font-size: 0.85rem;
  border-radius: var(--radius);
}

details.section[open] > summary {
  border-bottom: 1px solid var(--divider);
  border-radius: var(--radius) var(--radius) 0 0;
}

details.section > summary:hover {
  background: var(--bg-sunken);
}

.sec-name {
  font-family: var(--mono);
  font-weight: 600;
  color: var(--ha-primary);
}

.sec-count {
  margin-left: auto;
  color: var(--text-dim);
  font-size: 0.75rem;
}

.keyrows {
  display: grid;
  gap: 6px;
  padding: 12px 16px 0;
}

/* Key, value, remove. The key column is fixed so the value inputs line up
 * into a readable column instead of stepping with each key's length. */
.keyrow {
  display: grid;
  grid-template-columns: minmax(140px, 260px) 1fr auto;
  gap: 8px;
  align-items: center;
}

.keyname {
  font-family: var(--mono);
  font-size: 0.75rem;
  font-weight: 600;
  background: transparent;
  border-color: transparent;
  padding: 5px 6px;
}

.keyname:hover,
.keyname:focus {
  background: var(--bg);
  border-color: var(--divider);
}

.keyval {
  font-size: 0.82rem;
  padding: 5px 8px;
}

.iconbtn {
  padding: 4px 8px;
  line-height: 1;
  color: var(--text-dim);
  border-color: transparent;
}

.iconbtn:hover:not(:disabled) {
  color: var(--err-fg);
  border-color: var(--divider);
}

button.btn.danger {
  color: var(--err-fg);
}

.sec-actions {
  display: flex;
  gap: 8px;
  padding: 12px 16px 14px;
}

.sec-actions .btn.danger {
  margin-left: auto;
}

.hint {
  margin: 0 0 4px;
  padding: 0 2px;
  color: var(--text-dim);
  font-size: 0.78rem;
}

details.section .hint {
  padding: 12px 16px 0;
}

@container (max-width: 560px) {
  .keyrow {
    grid-template-columns: 1fr auto;
  }

  .keyname {
    grid-column: 1 / -1;
    background: var(--bg);
    border-color: var(--divider);
  }
}

/* ── configuration migration ─────────────────────────────────────── */

/* Moving between the add-on options and a config.ini. Folded shut and last
 * on the page: it is done once if ever, so it gets the weight of a footnote
 * rather than of the editor above it. */
details.migrate {
  padding: 0;
}

details.migrate > summary {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 11px 16px;
  cursor: pointer;
  user-select: none;
  font-size: 0.82rem;
  border-radius: var(--radius);
}

details.migrate > summary:hover {
  background: var(--bg-sunken);
}

details.migrate[open] > summary {
  border-bottom: 1px solid var(--divider);
  border-radius: var(--radius) var(--radius) 0 0;
}

.mig-title {
  font-weight: 600;
  color: var(--text-dim);
}

details.migrate[open] .mig-title,
details.migrate > summary:hover .mig-title {
  color: var(--text);
}

.mig-now {
  margin-left: auto;
  color: var(--text-faint);
  font-size: 0.75rem;
}

.mig-body {
  display: grid;
  gap: 10px;
  padding: 12px 16px 14px;
}

.mig-body p,
.mig-body li {
  margin: 0;
  font-size: 0.82rem;
  line-height: 1.5;
  color: var(--text-dim);
}

.mig-body h3 {
  margin: 2px 0 -4px;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--text-faint);
}

.mig-body ul,
.mig-body ol {
  display: grid;
  gap: 5px;
  margin: 0;
  padding-left: 20px;
}

/* The two ways to configure, side by side — what each one can do is the
 * answer to "which should I be on", so it leads. */
.mig-compare {
  display: grid;
  gap: 8px;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
}

.mig-opt {
  padding: 10px 12px;
  border: 1px solid var(--divider);
  border-radius: var(--radius);
  background: var(--bg-sunken);
}

.mig-opt.is-now {
  border-color: color-mix(in srgb, var(--ha-primary) 45%, var(--divider));
}

.mig-opt h4 {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 5px;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text);
}

.mig-chip {
  padding: 1px 7px;
  border-radius: 999px;
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  color: var(--ha-primary);
  background: color-mix(in srgb, var(--ha-primary) 15%, transparent);
}

/* Entity picker: flag a configured entity Home Assistant does not know. */
.warn-input {
  border-color: color-mix(in srgb, var(--warn) 55%, var(--divider));
}

.warn-text {
  color: var(--warn-fg);
}

/* ── live controls ───────────────────────────────────────────────── */

.controls {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--divider);
}

details.controls-fold {
  margin-top: 12px;
  border-top: 1px solid var(--divider);
}

details.controls-fold > summary {
  cursor: pointer;
  user-select: none;
  padding: 9px 0 2px;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  color: var(--text-dim);
}

details.controls-fold > summary:hover {
  color: var(--text);
}

details.controls-fold[open] > summary {
  margin-bottom: 8px;
}

.control {
  margin-bottom: 10px;
}

.control input[type="number"] {
  padding: 5px 8px;
  font-size: 0.82rem;
}

.slider-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  font-size: 0.8rem;
}

.slider-head .name {
  color: var(--text-dim);
  font-weight: 500;
}

.slider-val {
  font-variant-numeric: tabular-nums;
  font-family: var(--mono);
  font-size: 0.75rem;
}

input[type="range"] {
  width: 100%;
  padding: 0;
  margin: 4px 0 0;
  border: 0;
  background: transparent;
  accent-color: var(--ha-primary);
}

/* A control mid-write is dimmed rather than removed: the row must not
 * collapse and reflow the card while the server answers. */
.control input:disabled,
.controls input:disabled {
  opacity: 0.5;
}
