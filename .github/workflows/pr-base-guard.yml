name: PR base guard

# Retargets external feature work opened against main onto develop, then checks
# that every PR into develop is free of main-only release history. The workflow
# uses pull_request_target so its code always comes from the trusted default
# branch; contributor code is fetched only as Git objects and never executed.

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-base-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  base-and-history:
    runs-on: ubuntu-latest
    steps:
      - name: Retarget external feature work
        id: policy
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const target = 'develop';

            if (pr.base.ref !== 'main') {
              core.setOutput('check-history', 'true');
              return;
            }

            // Maintainers target main deliberately for releases, hotfixes and
            // repairs to CI that only take effect on the default branch.
            const maintainer = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            if (maintainer.includes(pr.author_association)) {
              core.info(`Opened by ${pr.author_association} — base left alone.`);
              core.setOutput('check-history', 'false');
              return;
            }

            core.info(`Retargeting #${pr.number} from main onto ${target}.`);
            try {
              await github.rest.pulls.update({
                ...context.repo,
                pull_number: pr.number,
                base: target,
              });
            } catch (error) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pr.number,
                body: [
                  `This pull request targets \`main\`, but feature work is merged into ` +
                  `\`${target}\` (see [CONTRIBUTING.md](https://github.com/tomquist/AstraMeter/blob/develop/CONTRIBUTING.md)).`,
                  '',
                  `Retargeting it automatically failed: ${error.message}`,
                  '',
                  `Please change the base branch to \`${target}\` using the **Edit** ` +
                  'button next to the pull request title.',
                ].join('\n'),
              });
              core.setOutput('check-history', 'false');
              core.setFailed(`Could not retarget onto ${target}: ${error.message}`);
              return;
            }

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: pr.number,
              body: [
                `I moved this pull request onto \`${target}\`, where feature work ` +
                'lands — `main` only ever receives releases, and GitHub offers it ' +
                'as the base by default, so this is nothing you did wrong.',
                '',
                'If you branched off `main`, the history check below explains how ' +
                `to rebase your own commits onto \`${target}\`.`,
              ].join('\n'),
            });
            core.setOutput('check-history', 'true');

      - name: Checkout trusted default branch
        if: steps.policy.outputs.check-history == 'true'
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch and verify immutable PR history
        if: steps.policy.outputs.check-history == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/develop:refs/remotes/origin/develop
          git fetch --no-tags origin \
            "pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"

          actual_head=$(git rev-parse "refs/remotes/pull/${PR_NUMBER}/head")
          if [ "$actual_head" != "$EXPECTED_HEAD" ]; then
            echo "::error::PR head changed while the history guard was starting; rerun the check."
            exit 1
          fi

      - name: Reject main-only history
        if: steps.policy.outputs.check-history == 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          scripts/check_pr_history.sh \
            "$HEAD_SHA" \
            origin/develop \
            origin/main \
            "$HEAD_REF" \
            "$HEAD_REPO" \
            "$BASE_REPO" \
            "$AUTHOR_LOGIN" \
            "$AUTHOR_TYPE"
