# Authenticates as a GitHub App installed on this repository, which needs these
# repository permissions (read and write): Contents (push main, the tag and the
# release branches; create the GitHub Release), Pull requests (open the develop sync
# PR, since develop only accepts pull requests) and Workflows (a release merge can
# carry .github/workflows changes to main).
# Configure the app's Client ID as the variable RELEASE_APP_CLIENT_ID and its private
# key as the secret RELEASE_APP_PRIVATE_KEY.

name: Release

run-name: Release v${{ github.event.inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.0), no v prefix"
        required: true
        type: string

# Everything that writes uses the app token; GITHUB_TOKEN needs nothing.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Checkout develop
        uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Privileged job (app token); don't share a cache that a PR run
          # could poison via crafted dependency files.
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run release script
        # The version goes through env, not into the script text, so it can't inject shell.
        run: ./release.sh "$VERSION"
        env:
          VERSION: ${{ github.event.inputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Extract release notes from CHANGELOG.md
        # Reads the tagged CHANGELOG.md (release.sh renamed "## Next" to "## <version>")
        # and keeps that section's body, minus surrounding blank lines. Never fails:
        # main and the tag are already pushed, so an empty section only drops the notes.
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          { git show "refs/tags/${VERSION}:CHANGELOG.md" || true; } | awk -v heading="## ${VERSION}" '
            $0 == heading { in_section = 1; next }
            in_section && /^## / { exit }
            in_section { lines[++n] = $0 }
            END {
              first = 1; while (first <= n && lines[first] ~ /^[[:space:]]*$/) first++
              last = n;  while (last >= first && lines[last] ~ /^[[:space:]]*$/) last--
              for (i = first; i <= last; i++) print lines[i]
            }
          ' >"$notes"
          if [ ! -s "$notes" ]; then
            echo "::warning::No '## ${VERSION}' section found in CHANGELOG.md; the release links to it only."
          else
            echo "" >>"$notes"
          fi
          echo "**Full changelog:** [CHANGELOG.md](${SERVER_URL}/${REPOSITORY}/blob/${VERSION}/CHANGELOG.md)" >>"$notes"
          cat "$notes"
        env:
          VERSION: ${{ github.event.inputs.version }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ github.event.inputs.version }}
          name: Release v${{ github.event.inputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
