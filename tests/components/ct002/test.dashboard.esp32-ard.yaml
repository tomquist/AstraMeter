esphome:
  name: ct002-dashboard-esp32-ard

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG

wifi:
  ssid: "test-ssid"
  password: "test-password"

external_components:
  - source:
      type: local
      path: ../../../esphome/components
    components: [ct002]

sensor:
  - platform: template
    id: grid_l1
    lambda: 'return 0.0f;'
    update_interval: 1s

ct002:
  id: ct002_main
  power_sensor_l1: grid_l1
  ct_type: HME-4
  udp_port: 12345
  filters:
    hampel:
      window: 7
    smoothing:
      alpha: 0.3
  # The same dashboard on the Arduino framework. ESPHome routes both ESP32
  # frameworks through the same web server (web_server_base includes
  # web_server_idf whenever USE_ESP32 is set), but the rest of the firmware
  # around it differs, and the schema accepts either — so both are built.
  dashboard:
    controls: true
