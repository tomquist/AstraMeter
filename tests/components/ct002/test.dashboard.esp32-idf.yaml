esphome:
  name: ct002-dashboard-esp32-idf

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ssid: "test-ssid"
  password: "test-password"

external_components:
  - source:
      type: local
      path: ../../../esphome/components
    components: [ct002]

sensor:
  - platform: template
    id: grid_l1
    lambda: 'return 0.0f;'
    update_interval: 1s

ct002:
  id: ct002_main
  power_sensor_l1: grid_l1
  ct_type: HME-4
  udp_port: 12345
  filters:
    hampel:
      window: 7
    smoothing:
      alpha: 0.3
  # The whole opt-in: no options needed. `dashboard: true` is the same
  # thing, `dashboard: false` (or removing the key) turns it back off.
  # `controls:` is off by default; on here so the write endpoints are in
  # the compile matrix too.
  dashboard:
    controls: true
    # Empty for everyone but a reverse proxy — listed here so the option is
    # in the compile matrix alongside the write endpoints it protects.
    allowed_hosts:
      - astrameter.example.lan
