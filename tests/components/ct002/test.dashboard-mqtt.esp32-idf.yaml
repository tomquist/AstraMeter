esphome:
  name: ct002-dashboard-mqtt-esp32-idf

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ssid: "test-ssid"
  password: "test-password"

mqtt:
  broker: 192.168.1.10
  port: 1883
  discovery: false

external_components:
  - source:
      type: local
      path: ../../../esphome/components
    components: [ct002]

sensor:
  - platform: template
    id: grid_l1
    lambda: 'return 0.0f;'
    update_interval: 1s

ct002:
  id: ct002_main
  power_sensor_l1: grid_l1
  ct_type: HME-4
  udp_port: 12345
  filters:
    hampel:
      window: 7
    smoothing:
      alpha: 0.3
  # The dashboard beside `mqtt_insights:`, so the coupling between them —
  # the page's card for that integration — is built in CI. The plain
  # dashboard build (no broker anywhere) is test.dashboard.esp32-idf.yaml;
  # that one is the default shape and must keep compiling on its own.
  dashboard:
    controls: true
  mqtt_insights:
    base_topic: astrameter
